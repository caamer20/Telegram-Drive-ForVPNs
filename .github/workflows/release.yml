name: "Release"

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get_version.outputs.VERSION }}`,
              name: `Telegram Drive for VPNs v${{ steps.get_version.outputs.VERSION }}`,
              body: `### New Features\n- **Progressive File Loading** — Files load in pages (50 first, then 200 at a time in the background) for dramatically faster UI on VPN connections\n- **In-App PDF Viewer** — Full PDF viewer with zoom, rotation, thumbnail sidebar, page navigation, and keyboard shortcuts\n- **Paginated Backend API** — \`cmd_get_files\` now supports offset/limit for cursor-based pagination\n\n### Security\n- **Strict Content Security Policy** — Replaced permissive \`csp: null\` with per-directive CSP rules\n\n### Improvements\n- **Centralized File Extensions** — All extension lists unified in \`utils/fileExtensions.ts\` with O(1) Set lookups\n- **Smarter Cache Invalidation** — File ops (delete, move, upload) now trigger progressive-loader refetch instead of full React Query cache invalidation\n- **Auth Branding** — Login screen updated to "Telegram Drive for VPNs"\n\n### Cleanup\n- Removed stale \`commands.rs.bak\` and empty \`menu.rs\`\n- Deduplicated \`FileTypeIcon\` using shared extension sets\n\nSee the assets below to download and install.`,
              draft: true,
              prerelease: false
            });
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - platform: windows-latest
            args: ''
            target: ''
          
          # Linux
          - platform: ubuntu-22.04
            args: ''
            target: ''
            
          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Install frontend dependencies
        working-directory: app
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: ./app
          args: ${{ matrix.args }}

      - name: Patch AppImage for cross-distro EGL compatibility
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          APPIMAGE_DIR="app/src-tauri/target/release/bundle/appimage"
          APPIMAGE=$(find "$APPIMAGE_DIR" -maxdepth 1 -name '*.AppImage' -print -quit 2>/dev/null || true)

          if [ -z "$APPIMAGE" ]; then
            echo "::warning::No .AppImage found in $APPIMAGE_DIR — skipping patch step"
            exit 0
          fi

          echo "--- Patching AppImage: $APPIMAGE ---"

          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool.AppImage
          chmod +x appimagetool.AppImage

          # Extract the AppImage
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract

          # Strip bundled EGL/GL libs that conflict with host GPU drivers
          STRIP_LIBS=(
            libEGL.so libEGL.so.1
            libGL.so libGL.so.1
            libGLdispatch.so libGLdispatch.so.0
            libGLX.so libGLX.so.0
            libGLESv2.so libGLESv2.so.2
          )
          for lib in "${STRIP_LIBS[@]}"; do
            find squashfs-root -name "$lib" -delete -print 2>/dev/null || true
          done

          # Detect inner binary name from existing AppRun
          INNER_BIN=$(grep -oP '(?<=exec\s\$\{HERE\}/)[^\s"]+|(?<=exec\s"\$\{HERE\}/)[^"]+' squashfs-root/AppRun 2>/dev/null \
            || basename "$APPIMAGE" .AppImage)

          echo "Detected inner binary: $INNER_BIN"

          # Write new AppRun
          cat > squashfs-root/AppRun << 'APPRUN_EOF'
          #!/bin/bash
          set -e
          HERE="$(dirname "$(readlink -f "$0")")"

          # --- Locale: normalise to C.UTF-8 if the user's locale is not generated ---
          if ! locale -a 2>/dev/null | grep -qi "^${LANG%%.*}"; then
            export LC_ALL=C.UTF-8
            export LANG=C.UTF-8
          fi

          # --- Accessibility: silence "AT-SPI: Could not obtain desktop bus" ---
          export NO_AT_BRIDGE=1

          # --- EGL platform auto-detection ---
          if [ -n "${WAYLAND_DISPLAY:-}" ]; then
            export EGL_PLATFORM=wayland
          elif [ -n "${DISPLAY:-}" ]; then
            export EGL_PLATFORM=x11
          fi

          # --- Point GLVND to the system ICD directory ---
          for d in /usr/share/glvnd/egl_vendor.d /usr/share/egl/egl_external_platform.d; do
            [ -d "$d" ] && export __EGL_VENDOR_LIBRARY_DIRS="${__EGL_VENDOR_LIBRARY_DIRS:+$__EGL_VENDOR_LIBRARY_DIRS:}$d"
          done

          # --- Preload first found system libEGL.so.1 so the host driver is used ---
          for p in /usr/lib/x86_64-linux-gnu/libEGL.so.1 \
                   /usr/lib64/libEGL.so.1 \
                   /usr/lib/libEGL.so.1; do
            if [ -f "$p" ]; then
              export LD_PRELOAD="${LD_PRELOAD:+$LD_PRELOAD:}$p"
              break
            fi
          done

          # --- Software rendering fallback ---
          if [ "${LIBGL_ALWAYS_SOFTWARE:-}" = "1" ]; then
            export GALLIUM_DRIVER=llvmpipe
            export MESA_GL_VERSION_OVERRIDE=3.3
          fi

          # --- LD_LIBRARY_PATH: system paths BEFORE bundled paths ---
          SYS_PATHS="/usr/lib/x86_64-linux-gnu:/usr/lib64:/usr/lib"
          export LD_LIBRARY_PATH="${SYS_PATHS}:${HERE}/usr/lib:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          exec "${HERE}/__INNER_BIN__" "$@"
          APPRUN_EOF

          # De-indent (the heredoc above is indented for YAML readability)
          sed -i 's/^          //' squashfs-root/AppRun
          # Substitute the real binary name
          sed -i "s|__INNER_BIN__|${INNER_BIN}|g" squashfs-root/AppRun
          chmod +x squashfs-root/AppRun

          echo "--- New AppRun contents ---"
          cat squashfs-root/AppRun

          # Repack
          ./appimagetool.AppImage --appimage-extract-and-run --comp gzip squashfs-root "$APPIMAGE.patched"
          mv "$APPIMAGE.patched" "$APPIMAGE"

          echo "::notice::AppImage patched successfully: $APPIMAGE"

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            })
